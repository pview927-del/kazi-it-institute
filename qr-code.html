<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code | KAZI IT AND INSTITUTE</title><link rel="stylesheet" href="style.css"><link rel="icon" href="logo.svg"></head><body><header class="nav"><div class="wrap navinner"><a class="brand" href="home.html"><img src="logo.svg" alt=""><span>KAZI IT<small>AND INSTITUTE</small></span></a><nav class="links" id="links"><a href="home.html">হোম</a><a href="courses.html">কোর্সসমূহ</a><a href="student-login.html">Student Login</a><a href="admin.html">Admin</a></nav><button class="menu" id="menu" aria-label="মেনু">মেনু</button></div></header><main><section class="page-hero"><div class="wrap"><h1>Student ID QR Code</h1><p>Student ID লিখে QR Code তৈরি করুন এবং ছবি হিসেবে সংরক্ষণ করুন।</p></div></section><section class="soft"><div class="wrap login-wrap"><div class="form-card"><div class="field"><label for="qr-id">Student ID</label><input id="qr-id" autocomplete="off" placeholder="যেমন: KAZI-2026-001"></div><button class="btn" id="qr-generate" type="button" style="margin-top:14px">QR Code তৈরি করুন</button><div id="qr-output" style="margin-top:22px"></div><div id="qr-status" class="status hidden"></div></div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const input=document.querySelector('#qr-id'),out=document.querySelector('#qr-output'),st=document.querySelector('#qr-status');document.querySelector('#qr-generate').onclick=()=>{const id=input.value.trim();out.innerHTML='';if(!id){st.textContent='Student ID লিখুন।';st.classList.remove('hidden');return}if(!window.QRCode){st.textContent='QR লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।';st.classList.remove('hidden');return}st.classList.add('hidden');const box=document.createElement('div');box.className='qr-wrap';box.style.flexDirection='column';box.style.alignItems='flex-start';out.appendChild(box);const qr=document.createElement('div');box.appendChild(qr);new QRCode(qr,{text:id,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});const label=document.createElement('p');label.textContent=id;box.appendChild(label);const btn=document.createElement('button');btn.className='btn outline';btn.textContent='QR ডাউনলোড';btn.onclick=()=>{const img=qr.querySelector('img'),canvas=qr.querySelector('canvas'),url=img?.src||canvas?.toDataURL();if(!url)return;const a=document.createElement('a');a.href=url;a.download='kazi-'+id+'-qr.png';a.click()};box.appendChild(btn)};</script></body></html>
